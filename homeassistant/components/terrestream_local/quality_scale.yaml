rules:
  action-setup:
    status: exempt
    comment: The integration uses standard entity actions.
  appropriate-polling: done
  brands:
    status: todo
    comment: Awaiting acceptance of home-assistant/brands PR 11222.
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: The integration defines no custom actions.
  docs-triggers:
    status: exempt
    comment: Standard state and numeric-state triggers are documented.
  docs-conditions:
    status: exempt
    comment: Standard numeric and availability conditions apply.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: todo
  docs-installation-parameters: todo
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done
  devices: done
  diagnostics: done
  discovery: done
  discovery-update-info: done
  docs-data-update: todo
  docs-examples: todo
  docs-known-limitations: todo
  docs-supported-devices: todo
  docs-supported-functions: todo
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices:
    status: exempt
    comment: Each entry represents one physical sensor with a fixed measurement set.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default:
    status: done
    comment: Measurements and supported configuration controls are enabled; no diagnostic counters or duplicate estimates are created.
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues: done
  stale-devices:
    status: exempt
    comment: Each entry represents one physical sensor; removing the entry removes its device.
  async-dependency:
    status: done
    comment: The client uses asyncio and aiohttp; pairing computation runs in a worker thread.
  inject-websession:
    status: done
    comment: The client and pairing flow use the aiohttp session provided by Home Assistant.
  strict-typing:
    status: done
    comment: Strict checks cover the integration; the typed client includes py.typed and entries use TerrestreamConfigEntry.
